<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexecontahedra - The 60-Faced Polyhedra</title>
  <meta name="description" content="Interactive 3D models of 32 hexecontahedra (60-faced polyhedra): 4 Catalan solids, the rhombic hexecontahedron and 27 uniform star duals.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%230f111a' stroke='%237aa2f7' stroke-width='2'/%3E%3Cpolygon points='16,6 25,22 7,22' fill='none' stroke='%237aa2f7' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/outfit/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="background-effects">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <div class="index-container">
    <header class="index-header">
      <h1>Hexecontahedra</h1>
      <p>32 polyhedra with 60 faces: 4 Catalan solids, the rhombic hexecontahedron and 27 uniform star duals.</p>
    </header>
    <p class="webgl-warning">3D previews need WebGL, which is not available in this browser.</p>
    <section class="gallery-toolbar" aria-label="Filter hexecontahedra">
      <div class="filter-groups" id="filter-groups" role="group" aria-label="Filter by family"></div>
      <div class="search-field">
        <label class="sr-only" for="gallery-search">Search hexecontahedra</label>
        <input id="gallery-search" class="gallery-search" type="search" placeholder="Search name, face shape, U25, | 2 3 5…" autocomplete="off" spellcheck="false">
      </div>
      <p class="gallery-status" id="gallery-status" aria-live="polite"></p>
    </section>
    <main class="polyhedra-grid" id="grid"></main>
    <div class="gallery-empty" id="gallery-empty" hidden>
      <p id="gallery-empty-message">No polyhedra match your filter.</p>
      <button id="gallery-reset" class="control-button" type="button">Reset filters</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="js/index.js"></script>
</body>
</html>
